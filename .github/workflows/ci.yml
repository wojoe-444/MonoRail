name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/command-hub

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/command-hub/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run build

  windows-exe:
    name: Windows installer
    runs-on: windows-latest
    # Pushes to main publish a GitHub release that the in-app updater reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/command-hub/package-lock.json
      - run: npm ci
      - name: Stamp version
        run: node scripts/set-ci-version.cjs
      - name: Build installer
        if: github.event_name != 'push'
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build installer and publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run release:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: CommandHub-windows-setup
          path: |
            apps/command-hub/release/*.exe
            apps/command-hub/release/latest.yml
          if-no-files-found: error
